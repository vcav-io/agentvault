name: CI (TypeScript)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint & build selkey client
        working-directory: packages/selkey-client
        run: npm ci && npm run lint && npm run build

      - name: Lint selkey-mcp
        working-directory: packages/selkey-mcp
        run: npm ci && npm run lint

      - name: Test selkey client
        working-directory: packages/selkey-client
        run: npm test

      - name: Build & test selkey-mcp
        working-directory: packages/selkey-mcp
        run: npm run build && npm test

      - name: Build & test selkey-demo-ui
        working-directory: packages/selkey-demo-ui
        run: npm ci && npx playwright install --with-deps chromium && npm run build && npm test
