services:
  relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile.relay
    image: ghcr.io/vcav-io/selkey-relay:latest
    # Published on host loopback only. The relay listens on all interfaces
    # inside the container so the demo service can reach it over the compose
    # network.
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - SELKEY_BIND_ADDR=0.0.0.0
      # Host header check: the demo reaches the relay as "relay"; the host
      # reaches it as localhost.
      - SELKEY_ALLOWED_HOSTS=relay
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SELKEY_MODEL_ID=${SELKEY_MODEL_ID:-claude-haiku-4-5-20251001}
      - SELKEY_OPENAI_MODEL_ID=${SELKEY_OPENAI_MODEL_ID:-gpt-4.1-mini}
      - SELKEY_GEMINI_MODEL_ID=${SELKEY_GEMINI_MODEL_ID:-gemini-3-flash-preview}
      - SELKEY_ENV=dev
      # Shared with the demo service, which creates sessions with it. The
      # default only keeps `docker compose up` working out of the box; set
      # your own (openssl rand -hex 32) in the environment or .env.
      - SELKEY_OPERATOR_TOKEN=${SELKEY_OPERATOR_TOKEN:-e389cfc46cd914d538582adbcaf54cd0065662fb90fe0a795fd5666f8fea2567}
      - SELKEY_INBOX_AUTH=off
      - SELKEY_HEALTH_EXPOSE_MODEL=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3100/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.demo
    image: ghcr.io/vcav-io/selkey-demo:latest
    # Published on host loopback only (the UI streams both agents' sessions).
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      relay:
        condition: service_healthy
    environment:
      - DEMO_BIND_ADDRESS=0.0.0.0
      - SELKEY_RELAY_URL=http://relay:3100
      # The relay is reached over the private compose network, not loopback.
      - SELKEY_RELAY_INSECURE_HTTP_HOSTS=relay
      # Same operator token as the relay. The demo pins the relay's verifying
      # key from the relay's /health at the first start (the relay is on the
      # private compose network); set SELKEY_RELAY_VERIFYING_KEY_HEX to pin a
      # key you obtained yourself.
      - SELKEY_OPERATOR_TOKEN=${SELKEY_OPERATOR_TOKEN:-e389cfc46cd914d538582adbcaf54cd0065662fb90fe0a795fd5666f8fea2567}
      - SELKEY_RELAY_VERIFYING_KEY_HEX=${SELKEY_RELAY_VERIFYING_KEY_HEX:-}
      - SELKEY_WORKDIR=/app/packages/selkey-demo-ui
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
